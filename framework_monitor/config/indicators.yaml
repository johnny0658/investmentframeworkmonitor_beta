- {id: term_premium_kw, name: 10y term premium (Kim-Wright), source: fred, series: THREEFYTP10, units: percent, <<: *daily, stale_after_days: 14, direction: -1, row: rates_debt, layer: 1, weight: 0.10, licence: public, notes: "Published with about a week's lag. NY Fed ACM model lands in Phase 4."}
- {id: fed_funds, name: Effective fed funds rate, source: fred, series: DFF, units: percent, <<: *daily, direction: -1, row: rates_debt, layer: 1, weight: 0.05, licence: public}
- {id: fed_deficit, name: Federal surplus or deficit (monthly), source: fred, series: MTSDS133FMS, units: usd_millions, <<: *monthly, direction: 1, row: rates_debt, layer: 1, weight: 0, licence: public, notes: "Monthly Treasury Statement via FRED. Monitor only until a 12-month-sum transform exists."}
- id: public_debt
  name: Total public debt outstanding (debt to the penny)
  source: treasury_fiscal
  series: debt_to_penny
  params: {endpoint: v2/accounting/od/debt_to_penny, date_field: record_date, value_field: tot_pub_debt_out_amt, scale: 1.0e-6}
  units: usd_millions
  <<: *daily
  transform: yoy
  direction: -1
  row: rates_debt
  layer: 1
  weight: 0.05
  licence: public
- id: tga_daily
  name: TGA closing balance (Daily Treasury Statement)
  source: treasury_fiscal
  series: dts_operating_cash_balance
  params:
    endpoint: v1/accounting/dts/operating_cash_balance
    date_field: record_date
    value_field: open_today_bal
    filters: ["account_type:eq:Treasury General Account (TGA) Closing Balance"]
  units: usd_millions
  <<: *daily
  direction: 0
  row: rates_debt
  layer: 1
  weight: 0
  licence: public
  notes: "Series under this account name starts 2022-04-18; DTS reports the closing balance in the open_today_bal field. WTREGEN carries the longer history."
- id: auction_btc_10y
  name: 10-year note auction bid-to-cover
  source: treasury_fiscal
  series: auctions_10y
  params:
    endpoint: v1/accounting/od/auctions_query
    date_field: auction_date
    value_field: bid_to_cover_ratio
    filters: ["original_security_term:eq:10-Year", "security_type:eq:Note", "inflation_index_security:eq:No"]
  units: ratio
  frequency: per_auction
  stale_after_days: 75
  direction: 1
  row: rates_debt
  layer: 1
  weight: 0.05
  licence: public
  notes: Includes reopenings
- id: auction_btc_30y
  name: 30-year bond auction bid-to-cover
  source: treasury_fiscal
  series: auctions_30y
  params:
    endpoint: v1/accounting/od/auctions_query
    date_field: auction_date
    value_field: bid_to_cover_ratio
    filters: ["original_security_term:eq:30-Year", "security_type:eq:Bond", "inflation_index_security:eq:No"]
  units: ratio
  frequency: per_auction
  stale_after_days: 75
  direction: 1
  row: rates_debt
  layer: 1
  weight: 0.05
  licence: public
  notes: Includes reopenings; TIPS excluded
- {id: fed_hike_prob_next, name: Next-meeting hike probability (Atlanta Fed tracker), source: atlanta_fed, series: market_probability_tracker, units: probability, <<: *daily, direction: -1, row: rates_debt, layer: 1, weight: 0.05, licence: public, enabled: false, notes: "Phase 4. CME FedWatch has no free API; do not scrape."}

