# Indicator catalogue (FR-2): the only place a series is defined.
#
# Fields
#   id               unique snake_case ID used everywhere else
#   source           fetcher module (fetchers/<source>.py) or `derived`
#   series           source series code / ticker
#   params           source-specific options (Treasury endpoint, price providers, scale)
#   formula          derived only: expression over other indicator IDs (engine, Phase 2)
#   units            canonical units (see schemas.Units); checked by `verify-series`
#   transform        level | yoy | ann_3m | diff_4w | diff_13w_pct | pct_rank
#   direction        +1 higher is good for risk assets, -1 bad, 0 monitor only
#   weight           weight inside its row; 0 = monitored / input only
#   stale_after_days flag as stale once the latest observation is older than this
#   licence          public | restricted (restricted raw values never reach the public repo)
#   enabled          false = declared but its fetcher lands in a later phase
#   catchup          also fetched by the 13:00 UTC catch-up run
#
# Price indicators store a total-return index (adjusted close on first fetch,
# then chained by daily returns). See fetchers/prices.py for why.
#   proxy            true when the indicator stands in for a missing paid source
#
# Stale windows count from the observation date, so monthly series allow for
# their publication lag (e.g. CPI for September is dated 1 Sept, released mid-Oct).
#
# Direction and weights are first-pass defaults for me to tune; they are not
# used for scoring until Phase 2.

# ---------------------------------------------------------------- defaults
_defaults:
  - &daily {frequency: daily, stale_after_days: 5}
  - &weekly {frequency: weekly, stale_after_days: 12}
  - &monthly {frequency: monthly, stale_after_days: 75}
  - &quarterly {frequency: quarterly, stale_after_days: 140}
  - &price {source: prices, units: index, frequency: daily, stale_after_days: 5, licence: restricted, transform: level, direction: 0, weight: 0}

indicators:
# ============================================================ LAYER 1: Regime
# ---------------------------------------------------------------- US liquidity
- {id: m2, name: M2 money stock, source: alfred, series: M2SL, units: usd_billions, <<: *monthly, transform: ann_3m, direction: 1, row: us_liquidity, layer: 1, weight: 0.10, licence: public, notes: "Revised after release; vintages stored via ALFRED. Growth, not level, matters (Myth 1)."}
- {id: fed_assets, name: Fed total assets, source: fred, series: WALCL, units: usd_millions, <<: *weekly, direction: 0, row: us_liquidity, layer: 1, weight: 0, licence: public, notes: Input to net_fed_liquidity}
- {id: tga, name: Treasury General Account (Fed H.4.1), source: fred, series: WTREGEN, units: usd_millions, <<: *weekly, direction: 0, row: us_liquidity, layer: 1, weight: 0, licence: public, notes: Input to net_fed_liquidity}
- {id: on_rrp, name: Overnight reverse repo, source: fred, series: RRPONTSYD, units: usd_billions, <<: *daily, direction: 0, row: us_liquidity, layer: 1, weight: 0, licence: public, notes: "Billions, unlike WALCL/WTREGEN (millions)"}
- id: net_fed_liquidity
  name: Net Fed liquidity
  source: derived
  formula: fed_assets - tga - on_rrp * 1000     # all USD millions
  units: usd_millions
  <<: *weekly
  transform: diff_13w_pct
  direction: 1
  row: us_liquidity
  layer: 1
  weight: 0.35
  licence: public
- {id: bank_reserves, name: Bank reserves, source: fred, series: WRESBAL, units: usd_millions, <<: *weekly, transform: yoy, direction: 1, row: us_liquidity, layer: 1, weight: 0.10, licence: public}
- {id: bank_credit, name: "Bank credit, all commercial banks", source: fred, series: TOTBKCR, units: usd_billions, <<: *weekly, transform: yoy, direction: 1, row: us_liquidity, layer: 1, weight: 0.05, licence: public}
- {id: business_loans, name: "C&I loans, all commercial banks", source: fred, series: BUSLOANS, units: usd_billions, <<: *monthly, transform: ann_3m, direction: 1, row: us_liquidity, layer: 1, weight: 0.05, licence: public, notes: "BUSLOANS is monthly on FRED (PRD said weekly); TOTCI is the weekly H.8 equivalent"}
- id: credit_impulse
  name: Credit impulse (change in 13-week bank credit growth)
  source: derived
  formula: impulse(bank_credit, 13)
  units: percent
  <<: *weekly
  direction: 1
  row: us_liquidity
  layer: 1
  weight: 0.10
  licence: public
  proxy: true
- {id: nfci, name: Chicago Fed NFCI, source: fred, series: NFCI, units: index, <<: *weekly, direction: -1, row: us_liquidity, layer: 1, weight: 0.15, licence: public, notes: Positive = tighter than average}
- {id: anfci, name: Chicago Fed adjusted NFCI, source: fred, series: ANFCI, units: index, <<: *weekly, direction: -1, row: us_liquidity, layer: 1, weight: 0.05, licence: public}
- {id: stlfsi, name: St. Louis Fed Financial Stress Index, source: fred, series: STLFSI4, units: index, <<: *weekly, direction: -1, row: us_liquidity, layer: 1, weight: 0.05, licence: public}

