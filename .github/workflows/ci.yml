name: ci

on:
  push:
    paths-ignore: ["data/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Validate config (unknown IDs fail here)
        run: python -m framework_monitor.cli validate
      - name: Tests (offline, recorded fixtures)
        run: python -m pytest -q
      - name: Licensing guard on the repo
        run: python -m framework_monitor.cli guard
